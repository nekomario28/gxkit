name: gxkit inspect
description: Detect an artifact and run the gxkit tool that inspects it — a CI gate for creative artifacts.
author: nekomario28
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: >-
      An artifact file, or a directory to scan for *.py artifacts. A document that is not
      Python (an OpenAPI spec, SQL DDL, a Mermaid diagram) is accepted as a single file
      with `tool` set, since detection reads a Python module.
    required: true
  tool:
    description: Name one tool (e.g. chartgx) instead of installing the whole family.
    required: false
    default: ""
  args:
    description: Extra flags for `gxkit inspect` (e.g. --json).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Install gxkit
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$TOOL" ]; then
          uv tool install "$ACTION_PATH/packages/$TOOL"
        else
          uv tool install "$ACTION_PATH/packages/gxkit"
        fi
    - name: Inspect
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        FLAGS: ${{ inputs.args }}
        TOOL: ${{ inputs.tool }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # `uv tool install` puts the executable in ~/.local/bin.
        export PATH="$HOME/.local/bin:$PATH"
        bash "$ACTION_PATH/scripts/inspect_path.sh"
