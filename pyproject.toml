[project]
name = "gxkit-workspace"
version = "0.0.0"
description = "Agent-native review loops for creative artifacts: inspect, exit codes, storyboards."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=7", "mypy>=1.10", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Strict on real mistakes; E501 (line length) is not one, PT018 is fine in tests.
select = ["E", "W", "F", "B", "SIM", "RUF", "UP", "PT", "I"]
ignore = ["E501", "PT018"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["tomli", "tomllib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
