[project]
name = "gxkit-workspace"
version = "0.0.0"
description = "Agent-native review loops for creative artifacts: inspect, exit codes, storyboards."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=7", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "networkx>=3", "shapely>=2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Strict on real mistakes; E501 (line length) is not one, PT018 is fine in tests.
select = ["E", "W", "F", "B", "SIM", "RUF", "UP", "PT", "I"]
ignore = ["E501", "PT018"]

[tool.mypy]
python_version = "3.10"
# `--strict` in config, so the type gate cannot quietly weaken. Every source
# file satisfies it; the reference-library cross-checks in the tests pin the
# hand-rolled maths that the type system cannot.
strict = true

[[tool.mypy.overrides]]
module = ["tomli", "tomllib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
