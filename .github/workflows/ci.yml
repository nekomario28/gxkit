name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Fail on credentials or machine paths in tracked files before anything
      # else; a public repo cannot un-leak a secret.
      - name: Pre-publication check
        run: python3 scripts/prepublish_check.py

      # Best effort: give the runner Mesa's software GL so the shadergx tests
      # actually run instead of skipping. If this fails, they skip and CI stays
      # green.
      - name: Headless GL (best effort)
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgbm1 || true

      - run: uv sync --all-packages
      - run: uv run pytest
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
