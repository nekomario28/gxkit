name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Software GL (shadergx) and ffmpeg (framegx) are best-effort; without them
  # those tests skip, and the coverage gate is only on the ubuntu leg.
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0            # the pre-publication check scans full history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: System tools (best effort)
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libgbm1 ffmpeg || true
      - name: Pre-publication check
        run: python3 scripts/prepublish_check.py
      - run: uv sync --all-packages --locked
      - name: Tests with a coverage floor
        run: |
          uv run pytest \
            --cov=gxcore --cov=chartgx --cov=levelgx --cov=flowgx --cov=protogx \
            --cov=authzgx --cov=depsgx --cov=schemagx --cov=docgx --cov=shadergx \
            --cov=framegx --cov=gxkit --cov-report=term-missing --cov-fail-under=100

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-packages --locked
      - run: uv run pytest           # GL/ffmpeg tests skip; the rest must pass

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-packages --locked
      - run: uv run pytest           # exercises the CGL GL path and POSIX-ish paths

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-packages --locked
      - run: uv run ruff check packages scripts
      - run: uv run ruff format --check packages scripts
      - run: uvx --from shellcheck-py shellcheck scripts/*.sh
      - run: uv run mypy packages/*/src

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --all-packages -o dist
      - run: uvx twine check dist/*
      - name: Every wheel carries its LICENSE and py.typed
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          bad = []
          for wheel in glob.glob("dist/*.whl"):
              names = zipfile.ZipFile(wheel).namelist()
              if not any(n.endswith("licenses/LICENSE") for n in names):
                  bad.append(f"{wheel}: no LICENSE")
              if not any(n.endswith("py.typed") for n in names):
                  bad.append(f"{wheel}: no py.typed")
          print("\n".join(bad) if bad else "all wheels carry LICENSE + py.typed")
          sys.exit(1 if bad else 0)
          PY
      - name: Install the built sdists in a clean env and smoke-test
        run: |
          uv venv /tmp/smoke --python 3.13
          uv pip install --python /tmp/smoke dist/*.tar.gz
          /tmp/smoke/bin/gxkit tools
          /tmp/smoke/bin/gxkit codes chartgx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p empty-artifacts
      - name: The published action passes on a clean artifact
        uses: ./  # zizmor: ignore[self-repository] -- deliberate: run the action in this checkout
        with:
          path: packages/levelgx/examples/good_level.py
      - name: The published action fails on a faulty artifact
        id: faulty
        continue-on-error: true
        uses: ./  # zizmor: ignore[self-repository]
        with:
          path: packages/levelgx/examples/softlock_level.py
      - name: It really failed (a green run would mean the gate is fake)
        if: steps.faulty.outcome != 'failure'
        run: |
          echo "::error::the action did not fail on a faulty artifact"
          exit 1
      - name: The action accepts an explicit tool and flags
        uses: ./  # zizmor: ignore[self-repository]
        with:
          path: packages/schemagx/examples/good_schema.py
          tool: schemagx
          args: "--json"
      - name: The action refuses a directory with no artifacts
        id: empty
        continue-on-error: true
        uses: ./  # zizmor: ignore[self-repository]
        with:
          path: empty-artifacts
      - name: It really failed on the empty directory
        if: steps.empty.outcome != 'failure'
        run: |
          echo "::error::the action reported success on a directory with no *.py artifacts"
          exit 1
      - name: The action refuses a missing path
        id: missing
        continue-on-error: true
        uses: ./  # zizmor: ignore[self-repository]
        with:
          path: does/not/exist
      - name: It really failed on the missing path
        if: steps.missing.outcome != 'failure'
        run: |
          echo "::error::the action reported success on a missing path"
          exit 1

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Workflow security
        run: uvx zizmor .
      - run: uv sync --all-packages --locked
      - name: Dependency audit
        run: uv run --with pip-audit pip-audit --skip-editable
