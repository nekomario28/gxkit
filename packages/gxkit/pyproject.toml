[project]
name = "gxkit-cli"
version = "0.1.0"
description = "One entry point for the gxkit family: detect an artifact and route it to the tool that inspects it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "nekomario28" }]
keywords = ["agents", "agent-native", "lint", "inspect", "review", "gxkit"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "gxcore>=0.4,<0.5",
    "chartgx",
    "levelgx",
    "flowgx",
    "authzgx",
    "depsgx",
    "schemagx",
    "docgx",
    "protogx",
    "shadergx",
    "framegx",
    "apigx",
    "netgx",
    "envgx",
    "pipegx",
]

[project.scripts]
gxkit = "gxkit.cli:main"

[tool.uv.sources]
gxcore = { workspace = true }
chartgx = { workspace = true }
levelgx = { workspace = true }
flowgx = { workspace = true }
authzgx = { workspace = true }
depsgx = { workspace = true }
schemagx = { workspace = true }
docgx = { workspace = true }
protogx = { workspace = true }
shadergx = { workspace = true }
framegx = { workspace = true }
apigx = { workspace = true }
netgx = { workspace = true }
envgx = { workspace = true }
pipegx = { workspace = true }

[project.urls]
Homepage = "https://github.com/nekomario28/gxkit"
Repository = "https://github.com/nekomario28/gxkit"
Issues = "https://github.com/nekomario28/gxkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxkit"]
