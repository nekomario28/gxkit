[project]
name = "pipegx"
version = "0.1.1"
description = "Inspect a build pipeline DAG for unknown steps, cycles and unproduced goals — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "nekomario28" }]
keywords = ["agents", "agent-native", "lint", "inspect", "review", "pipegx", "pipeline", "dag"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "gxcore>=0.5,<0.6",
    "Pillow>=9",
]

[project.scripts]
pipegx = "pipegx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[project.urls]
Homepage = "https://github.com/nekomario28/gxkit"
Repository = "https://github.com/nekomario28/gxkit"
Issues = "https://github.com/nekomario28/gxkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipegx"]
