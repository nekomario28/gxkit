[project]
name = "levelgx"
version = "0.1.0"
description = "Inspect game levels for reachability, solvability and soft-locks — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gxcore",
    "Pillow>=9",
]

[project.scripts]
levelgx = "levelgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/levelgx"]
