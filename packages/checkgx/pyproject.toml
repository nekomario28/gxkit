[project]
name = "checkgx"
version = "1.0.0"
description = "Inspect a check registry for checks that cannot fail — duplicates, never-evaluated names, and checks sitting in metadata."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "nekomario28" }]
keywords = ["agents", "agent-native", "lint", "inspect", "review", "checkgx"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "gxcore>=1.0,<2.0",
    "Pillow>=9",
]

[project.scripts]
checkgx = "checkgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[project.urls]
Homepage = "https://github.com/nekomario28/gxkit"
Repository = "https://github.com/nekomario28/gxkit"
Issues = "https://github.com/nekomario28/gxkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkgx"]
