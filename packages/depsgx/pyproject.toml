[project]
name = "depsgx"
version = "0.1.0"
description = "Inspect a module dependency graph for cycles, layer violations and dead code — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gxcore",
    "Pillow>=9",
]

[project.scripts]
depsgx = "depsgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depsgx"]
