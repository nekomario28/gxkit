[project]
name = "docgx"
version = "0.1.0"
description = "Inspect a page / slide for overflowing, overlapping or unreadable text — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gxcore",
    "Pillow>=9",
]

[project.scripts]
docgx = "docgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docgx"]
