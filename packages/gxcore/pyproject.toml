[project]
name = "gxcore"
version = "0.1.0"
description = "The shared review loop behind the *gx agent-native tools: problems, severities, storyboards, CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Pillow>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxcore"]
