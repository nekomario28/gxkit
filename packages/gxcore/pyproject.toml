[project]
name = "gxcore"
version = "0.4.0"
description = "The shared review loop behind the *gx agent-native tools: problems, severities, storyboards, CLI, graph and layout analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Pillow>=9",
    "tomli>=2; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxcore"]
