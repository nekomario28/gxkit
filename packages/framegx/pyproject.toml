[project]
name = "framegx"
version = "0.1.0"
description = "Inspect a rendered animation for black, frozen, wrong-length or sound-less output — codes, exit codes, contact-sheet storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "nekomario28" }]
keywords = ["agents", "agent-native", "lint", "inspect", "review", "framegx"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "gxcore>=0.6,<0.7",
    "numpy>=1.23",
    "Pillow>=9",
]

[project.scripts]
framegx = "framegx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[project.urls]
Homepage = "https://github.com/nekomario28/gxkit"
Repository = "https://github.com/nekomario28/gxkit"
Issues = "https://github.com/nekomario28/gxkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framegx"]
