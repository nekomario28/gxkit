[project]
name = "authzgx"
version = "0.1.0"
description = "Inspect permission models for privilege-escalation paths, inheritance cycles and dead config — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gxcore",
    "Pillow>=9",
]

[project.scripts]
authzgx = "authzgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authzgx"]
