[project]
name = "shadergx"
version = "0.1.0"
description = "Render a fragment shader and inspect the pixels — black, constant, NaN output, unused uniforms — with codes, exit codes and a storyboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gxcore",
    "moderngl>=5.10",
    "numpy>=1.23",
    "Pillow>=9",
]

[project.scripts]
shadergx = "shadergx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadergx"]
