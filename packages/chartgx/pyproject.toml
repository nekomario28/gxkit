[project]
name = "chartgx"
version = "0.1.0"
description = "Inspect matplotlib figures for misleading or broken charts — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gxcore",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "Pillow>=9",
]

[project.scripts]
chartgx = "chartgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartgx"]
