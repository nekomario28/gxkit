[project]
name = "flowgx"
version = "0.1.0"
description = "Inspect state machines and flow charts for unreachable, stuck and non-deterministic states — codes, exit codes, storyboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gxcore",
    "Pillow>=9",
]

[project.scripts]
flowgx = "flowgx.tool:main"

[tool.uv.sources]
gxcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowgx"]
