<text x="104" y="241.0" font-size="14.5" fill="#0f172a">inspect → problems + codes</text>
<line x1="76" y1="266.0" x2="76" y2="292.0" stroke="#cbd5e1" stroke-width="2"/>
<path d="M71 290.0 L76 299.0 L81 290.0" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<rect x="48" y="292.0" width="300" height="62" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="76" cy="323.0" r="14" fill="#0f172a"/>
<text x="76" y="328.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="104" y="329.0" font-size="14.5" fill="#0f172a">Fix, then inspect again</text>
<line x1="76" y1="354.0" x2="76" y2="380.0" stroke="#cbd5e1" stroke-width="2"/>
<path d="M71 378.0 L76 387.0 L81 378.0" fill="none" stroke="#cbd5e1" stroke-width="2"/>
