<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="t d" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">gxkit: one shared core, 16 inspect tools</title>
<desc id="d">gxcore is the shared review loop. 16 tools, one per artifact domain, each turn an artifact into problems with stable codes, an exit code and a storyboard.</desc>
<rect width="1040" height="620" fill="#ffffff"/>
<rect x="24" y="24" width="360" height="572" rx="16" fill="#f1f5f9"/>
<text x="48" y="66" font-size="19" font-weight="700" fill="#0f172a">The inspect loop</text>
<text x="48" y="90" font-size="13" fill="#64748b">an agent closes it on its own</text>
<rect x="48" y="116.0" width="300" height="62" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="76" cy="147.0" r="14" fill="#0f172a"/>
<text x="76" y="152.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="104" y="153.0" font-size="14.5" fill="#0f172a">Write the artifact as code</text>
