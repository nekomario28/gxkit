<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="t d" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">gxkit: one shared core, 13 inspect tools</title>
<desc id="d">gxcore is the shared review loop. 13 tools, one per artifact domain, each turn an artifact into problems with stable codes, an exit code and a storyboard.</desc>
