<circle cx="76" cy="411.0" r="14" fill="#0f172a"/>
<text x="76" y="416.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="104" y="417.0" font-size="14.5" fill="#0f172a">Exit 1 on error → ship</text>
<text x="48" y="562" font-size="12.5" fill="#64748b">every problem: a stable code, a severity,</text>
<text x="48" y="580" font-size="12.5" fill="#64748b">and a storyboard image as evidence</text>
<text x="712" y="44" font-size="15" fill="#64748b" text-anchor="middle">one core · 15 domains</text>
